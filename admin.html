<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — OSISVote</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="brand">OSIS<span>Vote</span> / Admin</div><a class="ghost" href="index.html">Halaman User</a></header><main class="admin"><div id="loginPanel" class="card login"><span class="badge">ADMIN</span><h1>Dashboard Admin</h1><p>Mode static: akses admin dilindungi PIN lokal. Untuk GitHub Pages, jangan menganggap kode client-side sebagai keamanan server.</p><form id="loginForm"><input id="adminPin" type="password" placeholder="PIN Admin" required><button class="btn primary">Masuk</button></form><div id="loginMsg" class="msg"></div></div><div id="dashboard" class="hidden"><div class="section-head"><div><span class="badge">DASHBOARD</span><h1>Kontrol Pemilihan</h1></div><button class="ghost" id="logout">Keluar</button></div><section class="stats"><div class="stat card"><small>Total suara</small><b id="totalVotes">0</b></div><div class="stat card"><small>Total token</small><b id="totalTokens">0</b></div><div class="stat card"><small>Token terpakai</small><b id="usedTokens">0</b></div></section><section class="card panel"><div class="section-head"><h2>Kontrol</h2><span id="electionState" class="status"></span></div><div class="actions"><button class="btn primary" id="toggleElection">Buka/Tutup Voting</button><button class="btn secondary" id="seedTokens">Generate 50 Token</button><button class="btn secondary" id="exportTokens">Export Token CSV</button><button class="btn secondary" id="resetVotes">Reset Data Demo</button></div></section><section class="card panel"><h2>Hasil Sementara</h2><div id="results"></div></section><section class="card panel"><h2>Token</h2><div id="tokenTable" class="table"></div></section></div></main><script src="js/crypto.js"></script><script src="js/admin.js"></script></body></html>
